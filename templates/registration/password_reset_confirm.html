<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha - FAKELAND</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { fkbg: '#0c0714', fkcard: '#160d26', fkborder: '#2a1b42', fkpurple: '#8b5cf6' } } } }</script>
</head>
<body class="bg-fkbg text-gray-200 min-h-screen flex items-center justify-center p-4">
    <div class="bg-fkcard border border-fkborder rounded-2xl p-6 md:p-8 max-w-md w-full">
        <h2 class="text-2xl font-bold text-white mb-2">Criar Nova Senha</h2>
        {% if validlink %}
        <p class="text-sm text-gray-400 mb-6">Quase lá. Digite sua nova senha de acesso abaixo.</p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-fkpurple hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition mt-2">Salvar Nova Senha</button>
        </form>
        {% else %}
        <p class="text-red-400 text-sm">O link de recuperação é inválido ou já foi usado. Por favor, solicite um novo.</p>
        {% endif %}
    </div>
</body>
</html>
