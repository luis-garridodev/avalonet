<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - FAKELAND</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { fkbg: '#0c0714', fkcard: '#160d26', fkborder: '#2a1b42', fkpurple: '#8b5cf6' } } } }</script>
</head>
<body class="bg-fkbg text-gray-200 min-h-screen flex items-center justify-center p-4">
    <div class="bg-fkcard border border-fkborder rounded-2xl p-6 md:p-8 max-w-md w-full shadow-2xl">
        <h2 class="text-2xl font-bold text-white mb-2">Recuperar Acesso</h2>
        <p class="text-sm text-gray-400 mb-6">Digite seu e-mail cadastrado para receber o feitiço de recuperação.</p>
        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Seu e-mail" required class="w-full bg-fkbg border border-fkborder rounded-xl px-4 py-3 mb-4 text-white outline-none focus:border-fkpurple transition">
            <button type="submit" class="w-full bg-fkpurple hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition">Enviar Link Mágico</button>
        </form>
    </div>
</body>
</html>
